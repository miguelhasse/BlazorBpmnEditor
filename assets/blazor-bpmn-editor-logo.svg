  <rect x="8" y="12" width="144" height="136" rx="28" fill="#eff6ff" stroke="#dbeafe" stroke-width="2"/>
  <g fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M52 64h11" marker-end="url(#arrow)"/>
