<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">System overview</title>
  <desc id="desc">Hosts compose independent editor kits over the Core scope and session. The document owns semantic and BPMNDI data; the canvas alone owns the JavaScript boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".13"/></filter>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; } text:not([fill]) { fill: #1e293b; }
      .cs { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; filter: url(#shadow); }
      .kit { fill: #fdf4ff; stroke: #7c3aed; stroke-width: 1.5; filter: url(#shadow); }
      .data { fill: #f0fdf4; stroke: #059669; stroke-width: 1.5; filter: url(#shadow); }
      .js { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
      .heading { font-size: 24px; font-weight: 700; } .name { font-weight: 600; }
    </style>
  </defs>
  <rect width="1100" height="850" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" class="heading">System overview</text>
  <text x="550" y="64" text-anchor="middle" fill="#64748b">Core behavior and persisted model; independent UI presentation; JointJS SVG.</text>
  <line x1="40" y1="84" x2="1060" y2="84" stroke="#e2e8f0" stroke-width="1.5"/>
  <path class="edge" d="M440 165H550"/>
  <path class="edge" d="M790 220V300"/>
  <path class="edge" d="M440 355H550"/>
  <path class="edge" d="M440 535H490V390H550"/>
  <path class="edge" d="M260 680V590"/>
  <path class="edge" d="M790 410V480"/>
  <path class="edge" marker-start="url(#arrow)" d="M790 590V680"/>
  <g transform="translate(80 120)"><rect class="cs" width="360" height="100" rx="8"/>
    <text x="180" y="30" text-anchor="middle"><tspan class="name">Host application</tspan><tspan x="180" dy="26">Chooses editor kit or custom layout</tspan><tspan x="180" dy="26">Supplies document and callbacks</tspan></text>
  </g>
  <g transform="translate(550 120)"><rect class="kit" width="480" height="100" rx="8"/>
    <text x="240" y="30" text-anchor="middle"><tspan class="name">Independent editor UI kits</tspan><tspan x="240" dy="26">BpmnEditor: standard HTML</tspan><tspan x="240" dy="26">FluentBpmnEditor: Fluent UI</tspan></text>
  </g>
  <g transform="translate(80 300)"><rect class="cs" width="360" height="110" rx="8"/>
    <text x="180" y="29" text-anchor="middle"><tspan class="name">Core + chosen kit registration</tspan><tspan x="180" dy="25">Options and registries</tspan><tspan x="180" dy="25">Validators and template loading</tspan></text>
  </g>
  <g transform="translate(550 300)"><rect class="cs" width="480" height="110" rx="8"/>
    <text x="240" y="29" text-anchor="middle"><tspan class="name">BpmnEditorScope (Core)</tspan><tspan x="240" dy="25">Headless BpmnEditorSession</tspan><tspan x="240" dy="25">Typed session + immutable state cascades</tspan></text>
  </g>
  <g transform="translate(80 480)"><rect class="data" width="360" height="110" rx="8"/>
    <text x="180" y="29" text-anchor="middle"><tspan class="name">BpmnDocument</tspan><tspan x="180" dy="25">Semantic model + BPMNDI</tspan><tspan x="180" dy="25">Immutable persisted model</tspan></text>
  </g>
  <g transform="translate(550 480)"><rect class="cs" width="480" height="110" rx="8"/>
    <text x="240" y="29" text-anchor="middle"><tspan class="name">BpmnCanvas (Core)</tspan><tspan x="240" dy="25">Interop boundary</tspan><tspan x="240" dy="25">Receives document through BpmnEditorCanvas</tspan></text>
  </g>
  <g transform="translate(80 680)"><rect class="data" width="360" height="110" rx="8"/>
    <text x="180" y="29" text-anchor="middle"><tspan class="name">BPMNDI layout</tspan><tspan x="180" dy="25">Bounds and connector waypoints</tspan><tspan x="180" dy="25">Included in the document</tspan></text>
  </g>
  <g transform="translate(550 680)"><rect class="js" width="480" height="110" rx="8"/>
    <text x="240" y="29" text-anchor="middle"><tspan class="name">Bpmn.Scripts</tspan><tspan x="240" dy="25">TypeScript canvas module</tspan><tspan x="240" dy="25">JointJS dia.Paper; SVG view and gestures</tspan></text>
  </g>
</svg>
