<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1220" role="img" aria-labelledby="title desc">
  <title id="title">Validation layers</title>
  <desc id="desc">Document validation produces an export-blocking report. Import schema findings and advisory expression warnings use separate presentation paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".13"/></filter>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; } text:not([fill]) { fill: #1e293b; }
      .cs { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; filter: url(#shadow); }
      .data { fill: #f0fdf4; stroke: #059669; stroke-width: 1.5; filter: url(#shadow); }
      .kit { fill: #fdf4ff; stroke: #7c3aed; stroke-width: 1.5; filter: url(#shadow); }
      .schema { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
      .orange { stroke: #d97706; marker-end: url(#arrow-orange); }
      .purple { stroke: #7c3aed; marker-end: url(#arrow-purple); }
      .heading { font-size: 24px; font-weight: 700; } .name { font-weight: 600; }
      text.badge { font-size: 13px; font-weight: 700; fill: white; }
    </style>
  </defs>
  <rect width="1100" height="1220" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" class="heading">Validation layers</text>
  <text x="550" y="64" text-anchor="middle" fill="#64748b">Document reports, import findings and expression warnings remain distinct.</text>
  <line x1="40" y1="84" x2="1060" y2="84" stroke="#e2e8f0" stroke-width="1.5"/>

  <circle cx="70" cy="150" r="14" fill="#2563eb"/><text x="70" y="155" text-anchor="middle" class="badge">1</text>
  <circle cx="70" cy="830" r="14" fill="#d97706"/><text x="70" y="835" text-anchor="middle" class="badge">2</text>
  <circle cx="70" cy="1010" r="14" fill="#7c3aed"/><text x="70" y="1015" text-anchor="middle" class="badge">3</text>
  <path class="edge" d="M325 210V260"/>
  <path class="edge" d="M325 380V440"/>
  <path class="edge" d="M325 550V610"/>
  <path class="edge" d="M640 320H530"/>
  <path class="edge" d="M640 495H530"/>
  <path class="edge orange" d="M530 855H640"/>
  <path class="edge purple" d="M530 1035H640"/>

  <g transform="translate(120 110)"><rect class="data" width="410" height="100" rx="8"/>
    <text x="205" y="35" text-anchor="middle"><tspan class="name">BpmnDocument</tspan><tspan x="205" dy="28">Immutable semantic model + BPMNDI</tspan></text>
  </g>
  <g transform="translate(120 260)"><rect class="cs" width="410" height="120" rx="8"/>
    <text x="205" y="29" text-anchor="middle"><tspan class="name">BpmnValidator (Core)</tspan><tspan x="205" dy="25">Reference and containment rules</tspan><tspan x="205" dy="25">Notation, semantics and DI</tspan><tspan x="205" dy="25">Generated rule IDs and messages</tspan></text>
  </g>
  <g transform="translate(640 260)"><rect class="cs" width="390" height="120" rx="8"/>
    <text x="195" y="29" text-anchor="middle"><tspan class="name">Product lint D004</tspan><tspan x="195" dy="25">Ambiguous split conditions</tspan><tspan x="195" dy="25">Current policy: error</tspan><tspan x="195" dy="25">Part of document validation</tspan></text>
  </g>
  <g transform="translate(120 440)"><rect class="data" width="410" height="110" rx="8"/>
    <text x="205" y="29" text-anchor="middle"><tspan class="name">BpmnValidationReport</tspan><tspan x="205" dy="25">Errors block export</tspan><tspan x="205" dy="25">Warnings, including D009, stay advisory</tspan></text>
  </g>
  <g transform="translate(640 440)"><rect class="cs" width="390" height="110" rx="8"/>
    <text x="195" y="29" text-anchor="middle"><tspan class="name">IBpmnProfileValidator</tspan><tspan x="195" dy="25">Host-defined profiles</tspan><tspan x="195" dy="25">BpmnElementTemplateValidator</tspan></text>
  </g>
  <g transform="translate(120 610)"><rect class="kit" width="410" height="110" rx="8"/>
    <text x="205" y="29" text-anchor="middle"><tspan class="name">Standard / Fluent validation panel</tspan><tspan x="205" dy="25">BpmnValidationPanelBase</tspan><tspan x="205" dy="25">Cached ordered + localized rows</tspan></text>
  </g>
  <g transform="translate(120 800)"><rect class="schema" width="410" height="110" rx="8"/>
    <text x="205" y="29" text-anchor="middle"><tspan class="name">BpmnXmlReader + XmlSchemaSet</tspan><tspan x="205" dy="25">Optional preloaded XSD only</tspan><tspan x="205" dy="25">No bundled or fetched OMG XSD</tspan></text>
  </g>
  <g transform="translate(640 800)"><rect class="schema" width="390" height="110" rx="8"/>
    <text x="195" y="29" text-anchor="middle"><tspan class="name">SchemaError diagnostics</tspan><tspan x="195" dy="25">BpmnImportPreview</tspan><tspan x="195" dy="25">Kit import dialog findings</tspan></text>
  </g>
  <g transform="translate(120 980)"><rect class="kit" width="410" height="110" rx="8"/>
    <text x="205" y="29" text-anchor="middle"><tspan class="name">IBpmnExpressionValidator</tspan><tspan x="205" dy="25">FEEL / JUEL syntax</tspan><tspan x="205" dy="25">Advisory; not export-blocking</tspan></text>
  </g>
  <g transform="translate(640 980)"><rect class="kit" width="390" height="110" rx="8"/>
    <text x="195" y="35" text-anchor="middle"><tspan class="name">Property entry warnings</tspan><tspan x="195" dy="28">aria-invalid + warning text</tspan></text>
  </g>

  <rect x="120" y="1130" width="910" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="575" y="1153" text-anchor="middle" font-weight="600" fill="#475569">Three independent diagnostic paths</text>
  <text x="575" y="1175" text-anchor="middle" font-size="14" fill="#64748b">Expression warnings do not enter document reports; schema findings belong to import offers.</text>
</svg>
