<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1310" role="img" aria-labelledby="title desc">
  <title id="title">Build and asset pipeline</title>
  <desc id="desc">Core and FEEL scripts build separate static web assets. Core consumes generated rules; independent editor kits consume Core. RESX and XLIFF localize Core and both kits. NuGet packages include built assets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".13"/></filter>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; } text:not([fill]) { fill: #1e293b; }
      .cs { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; filter: url(#shadow); }
      .kit { fill: #fdf4ff; stroke: #7c3aed; stroke-width: 1.5; filter: url(#shadow); }
      .js { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; filter: url(#shadow); }
      .data { fill: #f0fdf4; stroke: #059669; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
      .orange { stroke: #d97706; marker-end: url(#arrow-orange); }
      .green { stroke: #059669; marker-end: url(#arrow-green); }
      .input { stroke-dasharray: 5 3; }
      .heading { font-size: 24px; font-weight: 700; } .name { font-weight: 600; }
      text.badge { font-size: 13px; font-weight: 700; fill: white; }
    </style>
  </defs>
  <rect width="1460" height="1310" fill="#f8fafc"/>
  <text x="730" y="38" text-anchor="middle" class="heading">Build and asset pipeline</text>
  <text x="730" y="64" text-anchor="middle" fill="#64748b">Separate canvas and FEEL assets; generated rules; localized independent UI kits.</text>
  <line x1="40" y1="84" x2="1420" y2="84" stroke="#e2e8f0" stroke-width="1.5"/>

  <circle cx="50" cy="150" r="14" fill="#d97706"/><text x="50" y="155" text-anchor="middle" class="badge">1</text>
  <circle cx="50" cy="470" r="14" fill="#2563eb"/><text x="50" y="475" text-anchor="middle" class="badge">2</text>
  <circle cx="50" cy="855" r="14" fill="#059669"/><text x="50" y="860" text-anchor="middle" class="badge">3</text>
  <path class="edge orange" d="M680 250V295"/>
  <path class="edge orange" d="M680 395V440"/>
  <path class="edge green" d="M680 550V610"/>
  <path class="edge orange" d="M1180 250V295"/>
  <path class="edge orange" d="M1180 395V440"/>
  <path class="edge green" d="M1180 550V610"/>
  <path class="edge green" d="M240 550V610"/>
  <path class="edge" d="M400 665H480"/>
  <path class="edge" d="M880 665H910V1165H980"/>
  <path class="edge" d="M1180 720V1110"/>
  <path class="edge" d="M680 720V825"/>
  <path class="edge" d="M880 885H940V1195H980"/>
  <path class="edge green" d="M400 855H440V690H480"/>
  <path class="edge green" d="M400 910H480"/>
  <path class="edge orange" d="M240 230V295"/>
  <path class="edge orange input" d="M400 175H480"/>
  <text x="415" y="153" font-size="14" fill="#92400e">manifest</text>

  <g transform="translate(80 120)"><rect class="data" width="320" height="110" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">icons/</tspan><tspan x="160" dy="25">Glyph sources + manifest</tspan><tspan x="160" dy="25">C# embeds / TS imports JSON</tspan></text>
  </g>
  <g transform="translate(480 120)"><rect class="js" width="400" height="130" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">Bpmn.Scripts</tspan><tspan x="200" dy="25">JavaScript SDK project</tspan><tspan x="200" dy="25">npm prebuild: tsc + eslint</tspan><tspan x="200" dy="25">Build: esbuild + bundle checks</tspan></text>
  </g>
  <g transform="translate(980 120)"><rect class="js" width="400" height="130" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">Bpmn.Feel.Scripts</tspan><tspan x="200" dy="25">JavaScript SDK project</tspan><tspan x="200" dy="25">npm prebuild: tsc + eslint</tspan><tspan x="200" dy="25">Build: esbuild + license notices</tspan></text>
  </g>
  <g transform="translate(80 295)"><rect class="js" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">npm run icons:verify</tspan><tspan x="160" dy="25">Generated manifest check</tspan><tspan x="160" dy="25">Separate from normal prebuild</tspan></text>
  </g>
  <g transform="translate(480 295)"><rect class="data" width="400" height="100" rx="8"/>
    <text x="200" y="35" text-anchor="middle"><tspan class="name">Bpmn.Scripts/dist/</tspan><tspan x="200" dy="28">Core JS + CSS + manifest</tspan></text>
  </g>
  <g transform="translate(980 295)"><rect class="data" width="400" height="100" rx="8"/>
    <text x="200" y="35" text-anchor="middle"><tspan class="name">Bpmn.Feel.Scripts/dist/</tspan><tspan x="200" dy="28">feel-editor.js</tspan></text>
  </g>
  <g transform="translate(80 440)"><rect class="data" width="320" height="110" rx="8"/>
    <text x="160" y="35" text-anchor="middle"><tspan class="name">rules/bpmn-rules.json</tspan><tspan x="160" dy="28">AdditionalFiles + TS import</tspan></text>
  </g>
  <g transform="translate(480 440)"><rect class="data" width="400" height="110" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">StaticWebAssetSourceId</tspan><tspan x="200" dy="25">Hasseware.AspNetCore.</tspan><tspan x="200" dy="25">Components.Bpmn</tspan></text>
  </g>
  <g transform="translate(980 440)"><rect class="data" width="400" height="110" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">StaticWebAssetSourceId</tspan><tspan x="200" dy="25">Hasseware.AspNetCore.</tspan><tspan x="200" dy="25">Components.Bpmn.Feel</tspan></text>
  </g>
  <g transform="translate(80 610)"><rect class="cs" width="320" height="110" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Bpmn.RulesGenerator</tspan><tspan x="160" dy="25">Roslyn source generator</tspan><tspan x="160" dy="25">BpmnRules.g.cs</tspan></text>
  </g>
  <g transform="translate(480 610)"><rect class="cs" width="400" height="110" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">Bpmn Razor class library</tspan><tspan x="200" dy="25">_content/Hasseware.AspNetCore.</tspan><tspan x="200" dy="25">Components.Bpmn/...</tspan></text>
  </g>
  <g transform="translate(980 610)"><rect class="cs" width="400" height="110" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">Bpmn.Feel Razor class library</tspan><tspan x="200" dy="25">_content/Hasseware.AspNetCore.</tspan><tspan x="200" dy="25">Components.Bpmn.Feel/...</tspan></text>
  </g>
  <g transform="translate(80 825)"><rect class="data" width="320" height="120" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">RESX + XLIFF resources</tspan><tspan x="160" dy="25">Microsoft.DotNet.XliffTasks</tspan><tspan x="160" dy="25">Core + both UI kits</tspan></text>
  </g>
  <g transform="translate(480 825)"><rect class="kit" width="400" height="120" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">Standard + Fluent editor RCLs</tspan><tspan x="200" dy="25">Independent Core references</tspan><tspan x="200" dy="25">Kit markup + styles</tspan><tspan x="200" dy="25">No dependency between kits</tspan></text>
  </g>
  <g transform="translate(980 1110)"><rect class="cs" width="400" height="130" rx="8"/>
    <text x="200" y="29" text-anchor="middle"><tspan class="name">dotnet build / pack</tspan><tspan x="200" dy="25">RCL assemblies + static web assets</tspan><tspan x="200" dy="25">NuGet consumption: no npm</tspan><tspan x="200" dy="25">Independent library packages</tspan></text>
  </g>
  <rect x="80" y="1010" width="800" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="480" y="1037" text-anchor="middle" font-weight="600" fill="#475569">Build-time tooling, not consumer prerequisites</text>
  <text x="480" y="1063" text-anchor="middle" fill="#64748b">dotnet build invokes both script projects; pack ships their compiled assets.</text>
</svg>
