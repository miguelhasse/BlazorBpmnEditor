<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1330" role="img" aria-labelledby="title desc">
  <title id="title">Project dependencies</title>
  <desc id="desc">Solid arrows point from dependent projects to referenced projects. The standard and Fluent editor kits independently reference Core, and the agent tool packages (Tools, WebMcp) build on it. Dashed arrows describe shared inputs and produced assets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".13"/></filter>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; font-size: 16px; } text:not([fill]) { fill: #1e293b; }
      .cs { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; filter: url(#shadow); }
      .kit { fill: #fdf4ff; stroke: #7c3aed; stroke-width: 1.5; filter: url(#shadow); }
      .js { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; filter: url(#shadow); }
      .data { fill: #f0fdf4; stroke: #059669; stroke-width: 1.5; filter: url(#shadow); }
      .test { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; filter: url(#shadow); }
      .edge { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
      .input { stroke-dasharray: 5 3; } .heading { font-size: 24px; font-weight: 700; } .name { font-weight: 600; }
    </style>
  </defs>
  <rect width="1740" height="1330" fill="#f8fafc"/>
  <text x="870" y="38" text-anchor="middle" class="heading">Project dependencies</text>
  <text x="870" y="64" text-anchor="middle" fill="#64748b">Solid: dependent → referenced project. Dashed: shared input / produced assets.</text>
  <line x1="40" y1="84" x2="1700" y2="84" stroke="#e2e8f0" stroke-width="1.5"/>
  <path class="edge" d="M990 230V285"/>
  <path class="edge" d="M990 385V440"/>
  <path class="edge" d="M990 540V565H270V610"/>
  <path class="edge" d="M990 540V580H630V610"/>
  <path class="edge" d="M990 540V610"/>
  <path class="edge" d="M1150 490H1195V935H805V865H790"/>
  <path class="edge" d="M270 730V760H630V810"/>
  <path class="edge" d="M630 730V810"/>
  <path class="edge" d="M990 730V775H700V810"/>
  <path class="edge" d="M270 730V745H990V810"/>
  <path class="edge" d="M630 920V950H270V990"/>
  <path class="edge" d="M700 920V990"/>
  <path class="edge input" d="M990 920V1190"/>
  <path class="edge input" d="M270 1100V1140H990V1190"/>
  <path class="edge input" d="M270 540V590H55V970H630V990"/>
  <path class="edge input" d="M200 540V575H40V1045H110"/>
  <path class="edge input" d="M270 385V420H70V1065H110"/>
  <path class="edge" d="M270 230V255H20V785H600V810"/>
  <path class="edge" d="M190 230V265H85V690H110"/>
  <path class="edge" d="M350 230V250H460V660H470"/>
  <path class="edge" d="M430 180H460V595H990V610"/>
  <path class="edge" d="M630 230V270H1220V950H815V890H790"/>
  <path class="edge" d="M1290 690H1260V955H775V920"/>
  <path class="edge" d="M1400 610V540"/>
  <path class="edge" d="M1450 730V810"/>
  <path class="edge" d="M1610 490H1670V975H745V920"/>
  <path class="edge" d="M1400 230V440"/>
  <path class="edge" d="M1610 175H1650V670H1610"/>
  <path class="edge" d="M1150 520H1240V640H1290"/>
  <path class="edge input" d="M1450 920V1240H1150"/>
  <g transform="translate(110 120)"><rect class="test" width="320" height="110" rx="8"/>
    <text x="160" y="26" text-anchor="middle"><tspan class="name">Core + editor test projects</tspan><tspan x="160" dy="24">Bpmn.Tests / Editor / FluentEditor</tspan><tspan x="160" dy="24">Core, FEEL and kit behavior</tspan><tspan x="160" dy="24">Architecture and parity checks</tspan></text>
  </g>
  <g transform="translate(470 120)"><rect class="test" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Bpmn.Benchmarks</tspan><tspan x="160" dy="26">Managed session / render costs</tspan><tspan x="160" dy="26">References Core</tspan></text>
  </g>
  <g transform="translate(830 120)"><rect class="test" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Bpmn.E2E.Tests</tspan><tspan x="160" dy="26">Demo build dependency only</tspan><tspan x="160" dy="26">Browser coverage of both kits</tspan></text>
  </g>
  <g transform="translate(110 285)"><rect class="data" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">icons/</tspan><tspan x="160" dy="25">Shared glyph manifest</tspan><tspan x="160" dy="25">Embedded in Core; TS imports JSON</tspan></text>
  </g>
  <g transform="translate(830 285)"><rect class="cs" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Bpmn.Demo</tspan><tspan x="160" dy="25">playground/Bpmn.Demo</tspan><tspan x="160" dy="25">Server host</tspan></text>
  </g>
  <g transform="translate(110 440)"><rect class="data" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">rules/bpmn-rules.json</tspan><tspan x="160" dy="25">Shared C# / TypeScript rules</tspan><tspan x="160" dy="25">Generator input + TS import</tspan></text>
  </g>
  <g transform="translate(830 440)"><rect class="cs" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Bpmn.Demo.Client</tspan><tspan x="160" dy="25">Standard + Fluent pages</tspan><tspan x="160" dy="25">References both kits, Core, FEEL, WebMCP</tspan></text>
  </g>
  <g transform="translate(110 610)"><rect class="cs" width="320" height="120" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Bpmn.Feel</tspan><tspan x="160" dy="25">Optional FEEL component</tspan><tspan x="160" dy="25">References Core + FEEL scripts</tspan><tspan x="160" dy="25">Independent interop boundary</tspan></text>
  </g>
  <g transform="translate(470 610)"><rect class="kit" width="320" height="120" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">BpmnEditor</tspan><tspan x="160" dy="25">Standard Blazor UI kit</tspan><tspan x="160" dy="25">References Core only</tspan><tspan x="160" dy="25">No Fluent UI dependency</tspan></text>
  </g>
  <g transform="translate(830 610)"><rect class="kit" width="320" height="120" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">FluentUI.BpmnEditor</tspan><tspan x="160" dy="25">Independent Core reference</tspan><tspan x="160" dy="25">Fluent UI Components + Icons</tspan><tspan x="160" dy="25">No standard kit dependency</tspan></text>
  </g>
  <g transform="translate(470 810)"><rect class="cs" width="320" height="110" rx="8"/>
    <text x="160" y="27" text-anchor="middle"><tspan class="name">Bpmn (Core)</tspan><tspan x="160" dy="24">Canvas, model and behavior</tspan><tspan x="160" dy="24">Serialization and validation</tspan><tspan x="160" dy="24">No Fluent UI dependency</tspan></text>
  </g>
  <g transform="translate(830 810)"><rect class="js" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Bpmn.Feel.Scripts</tspan><tspan x="160" dy="26">JavaScript SDK .esproj</tspan><tspan x="160" dy="26">Private build dependency</tspan></text>
  </g>
  <g transform="translate(110 990)"><rect class="js" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Bpmn.Scripts</tspan><tspan x="160" dy="26">JavaScript SDK .esproj</tspan><tspan x="160" dy="26">Private build dependency</tspan></text>
  </g>
  <g transform="translate(470 990)"><rect class="cs" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Bpmn.RulesGenerator</tspan><tspan x="160" dy="26">Roslyn analyzer only</tspan><tspan x="160" dy="26">ReferenceOutputAssembly=false</tspan></text>
  </g>
  <g transform="translate(830 1190)"><rect class="data" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Static web assets</tspan><tspan x="160" dy="25">Core canvas + FEEL + WebMCP bundles</tspan><tspan x="160" dy="25">Shipped in their RCL packages</tspan></text>
  </g>
  <g transform="translate(1290 120)"><rect class="test" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Tools + WebMcp tests</tspan><tspan x="160" dy="26">Bpmn.Tools.Tests</tspan><tspan x="160" dy="26">Bpmn.WebMcp.Tests</tspan></text>
  </g>
  <g transform="translate(1290 440)"><rect class="cs" width="320" height="100" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Bpmn.Tools</tspan><tspan x="160" dy="25">Agent tool handlers (preview)</tspan><tspan x="160" dy="25">References Core only</tspan></text>
  </g>
  <g transform="translate(1290 610)"><rect class="cs" width="320" height="120" rx="8"/>
    <text x="160" y="29" text-anchor="middle"><tspan class="name">Bpmn.WebMcp</tspan><tspan x="160" dy="25">Browser agent tools (preview)</tspan><tspan x="160" dy="25">References Core, Tools + scripts</tspan><tspan x="160" dy="25">Read-only WebMCP tools</tspan></text>
  </g>
  <g transform="translate(1290 810)"><rect class="js" width="320" height="110" rx="8"/>
    <text x="160" y="31" text-anchor="middle"><tspan class="name">Bpmn.WebMcp.Scripts</tspan><tspan x="160" dy="26">JavaScript SDK .esproj</tspan><tspan x="160" dy="26">Private build dependency</tspan></text>
  </g>
</svg>
