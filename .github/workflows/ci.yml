name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  native-aot:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Bpmn.AotSmoke
            properties: ''
          - project: Bpmn.AotSmoke
            properties: '-p:BpmnSmokeParsers=javascript'
          - project: Bpmn.AotSmoke
            properties: '-p:BpmnSmokeParsers=lua'
          - project: Bpmn.AotHttpSmoke
            properties: '-p:BpmnSmokeMcp=true'
          - project: Bpmn.AotHttpSmoke
            properties: '-p:BpmnSmokeSignalR=true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Bpmn.Scripts/package-lock.json
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Install canvas build dependencies
        working-directory: src/Bpmn.Scripts
        run: npm ci
      - name: Analyze and publish native verification host
        run: >-
          dotnet publish tests/${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r linux-x64 -o artifacts/native
          -p:BpmnCompatibilityAnalysis=true -p:TreatWarningsAsErrors=true
          ${{ matrix.properties }}
      - name: Execute published native artifact
        run: ./artifacts/native/${{ matrix.project }}
      - name: Publish native CLI
        if: matrix.project == 'Bpmn.AotSmoke' && matrix.properties == ''
        run: >-
          dotnet publish src/Bpmn.Mcp.Tool/Hasseware.AspNetCore.Components.Bpmn.Mcp.Tool.csproj
          -c Release -r linux-x64 -o artifacts/native-cli
          -p:PublishAot=true -p:PackAsTool=false
          -p:JsonSerializerIsReflectionEnabledByDefault=false
          -p:BpmnCompatibilityAnalysis=true -p:TreatWarningsAsErrors=true
      - name: Execute native CLI and stdio protocol
        if: matrix.project == 'Bpmn.AotSmoke' && matrix.properties == ''
        shell: pwsh
        run: >-
          ./tests/Bpmn.AotSmoke/Verify-NativeCli.ps1
          -Executable ./artifacts/native-cli/Hasseware.AspNetCore.Components.Bpmn.Mcp.Tool
          -SampleDirectory ./playground/Bpmn.Demo/wwwroot/samples

  build:
    # Pinned rather than ubuntu-latest: the visual regression suite arriving with the full
    # marker matrix compares rendered output, which is only stable on a fixed image.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/Bpmn.Scripts/package-lock.json
            src/Bpmn.WebMcp.Scripts/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore BlazorBpmnEditor.slnx

      - name: Verify formatting
        run: dotnet format BlazorBpmnEditor.slnx --verify-no-changes --no-restore

      - name: Install npm dependencies
        working-directory: src/Bpmn.Scripts
        run: npm ci

      # Type-check, lint and unit-test the TypeScript before anything consumes the bundle, so a
      # failure names the real cause instead of surfacing as a missing static web asset.
      - name: Check TypeScript
        working-directory: src/Bpmn.Scripts
        run: npm run check

      - name: Install WebMCP module dependencies
        working-directory: src/Bpmn.WebMcp.Scripts
        run: npm ci

      - name: Check WebMCP module
        working-directory: src/Bpmn.WebMcp.Scripts
        run: npm run check

      - name: Check all owned-source trimming and AOT diagnostics
        shell: pwsh
        run: ./tests/Bpmn.AotSmoke/Verify-CompatibilityAnalysis.ps1

      # Analysis sets IsTrimmable; rebuild normal artifacts before tests and --no-build packing.
      - name: Build
        run: dotnet build BlazorBpmnEditor.slnx -c Release -t:Rebuild --no-restore

      - name: Unit and component tests
        run: dotnet test tests/Bpmn.Tests/Hasseware.AspNetCore.Components.Bpmn.Tests.csproj -c Release --no-build

      - name: Agent tool tests
        run: dotnet test tests/Bpmn.Tools.Tests/Hasseware.AspNetCore.Components.Bpmn.Tools.Tests.csproj -c Release --no-build

      - name: WebMCP tests
        run: dotnet test tests/Bpmn.WebMcp.Tests/Hasseware.AspNetCore.Components.Bpmn.WebMcp.Tests.csproj -c Release --no-build

      - name: File store tests
        run: dotnet test tests/Bpmn.Storage.FileSystem.Tests/Hasseware.AspNetCore.Components.Bpmn.Storage.FileSystem.Tests.csproj -c Release --no-build

      - name: MCP server and tool tests
        run: dotnet test tests/Bpmn.Mcp.Tests/Hasseware.AspNetCore.Components.Bpmn.Mcp.Tests.csproj -c Release --no-build

      - name: MCP HTTP host tests
        run: dotnet test tests/Bpmn.Mcp.AspNetCore.Tests/Hasseware.AspNetCore.Components.Bpmn.Mcp.AspNetCore.Tests.csproj -c Release --no-build

      - name: Live-update transport tests
        run: |
          dotnet test tests/Bpmn.Storage.ServerSentEvents.Tests/Hasseware.AspNetCore.Components.Bpmn.Storage.ServerSentEvents.Tests.csproj -c Release --no-build
          dotnet test tests/Bpmn.Storage.SignalR.Tests/Hasseware.AspNetCore.Components.Bpmn.Storage.SignalR.Tests.csproj -c Release --no-build

      - name: Storage backend and sample tests
        run: |
          dotnet test tests/Bpmn.Storage.AzureBlob.Tests/Hasseware.AspNetCore.Components.Bpmn.Storage.AzureBlob.Tests.csproj -c Release --no-build
          dotnet test tests/Bpmn.Storage.EfCore.Tests/Hasseware.AspNetCore.Components.Bpmn.Storage.EfCore.Tests.csproj -c Release --no-build
          dotnet test tests/Bpmn.Samples.Tests/Bpmn.Samples.Tests.csproj -c Release --no-build

      - name: Install Playwright browsers
        run: pwsh tests/Bpmn.E2E.Tests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: End-to-end tests
        run: dotnet test tests/Bpmn.E2E.Tests/Hasseware.AspNetCore.Components.Bpmn.E2E.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Bpmn/Hasseware.AspNetCore.Components.Bpmn.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Tools/Hasseware.AspNetCore.Components.Bpmn.Tools.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.WebMcp/Hasseware.AspNetCore.Components.Bpmn.WebMcp.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.FileSystem/Hasseware.AspNetCore.Components.Bpmn.Storage.FileSystem.csproj -c Release --no-build -o artifacts
          dotnet pack tests/Bpmn.Storage.Testing/Hasseware.AspNetCore.Components.Bpmn.Storage.Testing.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Mcp/Hasseware.AspNetCore.Components.Bpmn.Mcp.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Mcp.AspNetCore/Hasseware.AspNetCore.Components.Bpmn.Mcp.AspNetCore.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.ServerSentEvents/Hasseware.AspNetCore.Components.Bpmn.Storage.ServerSentEvents.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.ServerSentEvents.Client/Hasseware.AspNetCore.Components.Bpmn.Storage.ServerSentEvents.Client.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.SignalR/Hasseware.AspNetCore.Components.Bpmn.Storage.SignalR.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.SignalR.Client/Hasseware.AspNetCore.Components.Bpmn.Storage.SignalR.Client.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.AzureBlob/Hasseware.AspNetCore.Components.Bpmn.Storage.AzureBlob.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Storage.EfCore/Hasseware.AspNetCore.Components.Bpmn.Storage.EfCore.csproj -c Release --no-build -o artifacts
          dotnet pack src/Bpmn.Mcp.Tool/Hasseware.AspNetCore.Components.Bpmn.Mcp.Tool.csproj -c Release --no-build -o artifacts

      - name: Publish the playground and check its precompressed assets
        run: |
          dotnet publish playground/Bpmn.Demo/Bpmn.Demo.csproj -c Release -p:TrimMode=full -o artifacts/publish-demo
          node src/Bpmn.Scripts/tools/publish-size.mjs artifacts/publish-demo/wwwroot

      - name: Verify linked browser components and interop
        env:
          BPMN_E2E_PUBLISHED_DIRECTORY: ${{ github.workspace }}/artifacts/publish-demo
        run: >-
          dotnet run --project tests/Bpmn.E2E.Tests -c Release --no-build --
          -class '*CompatibilityTests' -class '*CanvasSmokeTests'
          -class '*FeelAuthoringTests' -class '*WebMcpTests'
          -class '*ExecutionOverlayTests' -maxThreads 2 -noColor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: warn
